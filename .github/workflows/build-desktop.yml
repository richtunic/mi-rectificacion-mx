name: Compilaciones de escritorio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Intel)
            os: macos-15-intel
            platform: macos
            package_type: dmg
            artifact: mi-rectificacion-mx-macos-x86_64
            dx_asset: dx-x86_64-apple-darwin.zip
            dx_sha256: b2751a700b8b02f85fcdd8fe6e63c20876b4af9f0921c5be4c703e6f872b67ee
          - label: Windows (64 bits)
            os: windows-latest
            platform: windows
            package_type: nsis
            artifact: mi-rectificacion-mx-windows-x86_64
            dx_asset: dx-x86_64-pc-windows-msvc.zip
            dx_sha256: 45eb4f87b7f86fdba8508ee7e0ef1f9e13cf8f2ffcc6a2d5858d0e8ea7dd1531
          - label: Linux (64 bits)
            os: ubuntu-24.04
            platform: linux
            package_type: appimage
            artifact: mi-rectificacion-mx-linux-x86_64
            dx_asset: dx-x86_64-unknown-linux-gnu.zip
            dx_sha256: 61d2132eaf3cd70ca1ac89a7ecc891fcd770e917a5869e29d465459371b26c83
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restaurar caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.platform }}

      - name: Instalar dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev pkg-config libfuse2t64 file

      - name: Descargar Dioxus CLI en macOS o Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          DX_ASSET: ${{ matrix.dx_asset }}
          DX_SHA256: ${{ matrix.dx_sha256 }}
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/dx.zip" \
            "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/$DX_ASSET"
          echo "$DX_SHA256  $RUNNER_TEMP/dx.zip" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/dx-bin"
          unzip -q "$RUNNER_TEMP/dx.zip" -d "$RUNNER_TEMP/dx-bin"
          echo "$RUNNER_TEMP/dx-bin" >> "$GITHUB_PATH"

      - name: Descargar Dioxus CLI en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DX_ASSET: ${{ matrix.dx_asset }}
          DX_SHA256: ${{ matrix.dx_sha256 }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "dx.zip"
          $destination = Join-Path $env:RUNNER_TEMP "dx-bin"
          Invoke-WebRequest -Uri "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/$env:DX_ASSET" -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:DX_SHA256) {
            throw "La suma SHA-256 de Dioxus CLI no coincide"
          }
          Expand-Archive -Path $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Comprobar Dioxus CLI
        run: dx --version

      - name: Crear paquete nativo
        run: dx bundle --release --package desktop --platform ${{ matrix.platform }} --package-types ${{ matrix.package_type }} --out-dir dist/${{ matrix.artifact }} --locked

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/**
          if-no-files-found: error
          retention-days: 30
